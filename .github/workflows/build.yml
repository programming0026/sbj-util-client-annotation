name: Build

# Compila y prueba la librería y el proyecto de ejemplo en cada push y pull request.
on:
  push:
    branches: [main]
  pull_request:

# Cancela la ejecución anterior de la misma rama cuando llega un commit nuevo.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  library:
    name: Library (tests, JaCoCo, checkstyle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify = compilar + tests + umbral de JaCoCo (80 %) + checkstyle + jars de fuentes y Javadoc.
      - name: Verify
        run: mvn -B -ntp verify
        working-directory: sbj-util-client

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: library-test-reports
          path: sbj-util-client/target/surefire-reports

  example:
    name: Example (against the library from this commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # El ejemplo depende de la librería: se instala la de este mismo commit para detectar regresiones
      # (los tests de la librería ya corren en el job anterior, por eso aquí se omiten).
      - name: Install the library
        run: mvn -B -ntp install -DskipTests
        working-directory: sbj-util-client

      - name: Test the example
        run: mvn -B -ntp verify
        working-directory: sbj-util-client-example

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: example-test-reports
          path: sbj-util-client-example/target/surefire-reports

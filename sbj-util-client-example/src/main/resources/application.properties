spring.application.name=sbj-util-client-example

# URL base de DummyJSON. Los clientes @RestHttpClient la usan con ${dummyjson.base-url}.
dummyjson.base-url=https://dummyjson.com

logging.level.com.juniverse.client.example=INFO

# Documentación OpenAPI: /v3/api-docs (JSON) y /swagger-ui.html (interfaz).
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.persist-authorization=true

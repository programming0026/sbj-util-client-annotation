spring.application.name=sbj-util-client-example

# Base URL of DummyJSON. The @RestHttpClient clients use it as ${dummyjson.base-url}.
dummyjson.base-url=https://dummyjson.com

logging.level.com.juniverse.client.example=INFO

# OpenAPI documentation: /v3/api-docs (JSON) and /swagger-ui.html (UI).
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.persist-authorization=true
